name: "Datadog Code Coverage Upload"
description: "Upload code coverage report files to Datadog"
branding:
  icon: "upload-cloud"
  color: "purple"
inputs:
  api_key:
    required: true
    description: Datadog API key to use to upload the report files.
  site:
    required: false
    default: datadoghq.com
    description: The Datadog site to upload the files to.
  files:
    required: false
    description: >
      Directories, files, or glob patterns used when looking for coverage report files.
      If a folder is provided, it is searched recursively for supported coverage reports.
    default: .
  ignored-paths:
    required: false
    description: A comma-separated list of paths to exclude from report file discovery. Glob patterns are supported.
  flags:
    required: false
    description: >
      Flags to mark coverage reports for grouping and filtering (e.g., "type:unit-tests,jvm-21").
      A comma-separated list; maximum 32 flags per report.
  format:
    required: false
    description: Override the format of the coverage report files (auto-detected by default).
  base-path:
    required: false
    description: >
      Base path (relative to repository root) for the file paths inside the coverage reports.
      If not specified, paths are considered relative to repository root.
  version:
    required: false
    description: >
      Version of datadog-ci to install.
      Use a major version like "v5" (default) to get the latest release within that major version.
      Use a specific tag like "v5.6.0" to pin.
    default: "v5"
  extra-args:
    required: false
    default: ""
    description: Extra args to be passed to the datadog-ci coverage upload command.
runs:
  using: "composite"
  steps:
    - name: Install datadog-ci
      uses: DataDog/install-datadog-ci-github-action@v0
      with:
        version: ${{ inputs.version }}

    - name: Upload coverage report files
      shell: bash
      run: |
        flags_args=""
        if [[ -n "$FLAGS" ]]; then
          IFS=',' read -ra flag_items <<< "$FLAGS"
          for flag in "${flag_items[@]}"; do
            flag=$(echo "$flag" | xargs)
            if [[ -n "$flag" ]]; then
              flags_args+=" --flags $flag"
            fi
          done
        fi

        datadog-ci coverage upload \
          ${{ inputs.ignored-paths != '' && format('--ignored-paths {0}', inputs.ignored-paths) || '' }} \
          ${{ inputs.format != '' && format('--format {0}', inputs.format) || '' }} \
          ${{ inputs.base-path != '' && format('--base-path {0}', inputs.base-path) || '' }} \
          $flags_args \
          ${{ inputs.extra-args }} \
          ${{ inputs.files }}
      env:
        DD_API_KEY: ${{ inputs.api_key }}
        DD_SITE: ${{ inputs.site }}
        FLAGS: ${{ inputs.flags }}
